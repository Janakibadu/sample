<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>SPEAK — Schüler:innen-Startseite</title>
<link rel="stylesheet" href="theme.css">
<style>
  .tile-grid { display:grid; grid-template-columns: repeat(3, 1fr); gap:22px; margin-top:10px; max-width:1100px; }
  .tile:nth-child(1){ background: linear-gradient(160deg, var(--coral), #ff9a8b); transform:rotate(-1.5deg); }
  .tile:nth-child(2){ background: linear-gradient(160deg, var(--sky), #7ee8fa); transform:rotate(1deg); }
  .tile:nth-child(3){ background: linear-gradient(160deg, var(--grape), #c99bff); transform:rotate(-1deg); }
  .tile .icon { font-size:44px; }
  .tile .lock { font-size:30px; opacity:.6; }
</style>
</head>
<body class="app-student">

  <div class="funder-bar">
    <img class="funder-logo-tud" src="assets/tud_logo_cmyk.png" alt="TU Dortmund Logo">
    <img src="assets/IFS.png" alt="IFS Logo">
    <img src="assets/speak-logo.png" alt="SPEAK Logo">
    <img class="funder-logo-bund" src="assets/Bundesministrerium.jpg" alt="Bundesministerium Logo">
    <img src="assets/EBF.jpg" alt="EBF Logo">
  </div>

  <div class="student-top">
    <img class="logo-mark" src="assets/speak-logo.png" alt="SPEAK" style="height:64px;">
    <div style="display:flex; align-items:center; gap:14px;">
      <span class="pill pill-sun">⭐ 128 Sterne</span>
      <a class="avatar" href="01-home.html" style="background:var(--coral); text-decoration:none;" title="Abmelden">🧒</a>
    </div>
  </div>

  <div class="student-main" style="position:relative;">
    <div class="h1" style="font-size:30px;">Hallo Elli! Wähle eine Einheit.</div>
    <div class="muted" style="font-size:15px; margin-bottom:6px;">🔊 „Tippe auf eine Karte, um mit dem Lernen zu beginnen"</div>

    <div class="tile-grid">
      <a class="tile" href="17-reward-completion.html" style="color:#fff;">
        <div class="icon">📖</div>
        <div>
          <div style="font-weight:800; font-size:19px;">Einheit 6 · Wortschatz</div>
          <div class="progress-track" style="background:rgba(255,255,255,.35); margin-top:8px;"><div class="progress-fill" style="width:100%; background:#fff;"></div></div>
        </div>
      </a>
      <a class="tile" href="11-module-player.html" style="color:#fff;">
        <div class="icon">🧩</div>
        <div>
          <div style="font-weight:800; font-size:19px;">Einheit 10 · Grammatik</div>
          <div class="progress-track" style="background:rgba(255,255,255,.35); margin-top:8px;"><div class="progress-fill" style="width:45%; background:#fff;"></div></div>
        </div>
      </a>
      <div class="tile locked" style="color:#fff; background:linear-gradient(160deg,#b9bccf,#d6d9ec); transform:rotate(1.5deg);">
        <div class="icon lock">🔒</div>
        <div>
          <div style="font-weight:800; font-size:19px;">Einheit 12 · Grammatik</div>
          <div class="muted" style="color:rgba(255,255,255,.9);">Noch nicht zugewiesen</div>
        </div>
      </div>
    </div>
  </div>

</body>
</html>
