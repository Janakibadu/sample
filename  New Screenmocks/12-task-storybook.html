<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>SPEAK — Aufgabe: Bilderbuch (Typ A)</title>
<link rel="stylesheet" href="theme.css">
<style>
  .stage { min-height: calc(100vh - 84px); display:flex; align-items:center; justify-content:center; padding: 20px 60px; }
  .book {
    display:flex; align-items:center; gap:40px; background:#fff; border-radius:32px; box-shadow: var(--shadow-lg);
    padding:40px; max-width:820px;
  }
  .illustration {
    width:280px; height:280px; border-radius:26px; background: linear-gradient(160deg, var(--sky), var(--mint));
    display:flex; align-items:center; justify-content:center; font-size:120px; flex:none;
  }
  .word-chip { display:inline-flex; align-items:center; gap:8px; background:var(--app-bg); padding:8px 16px; border-radius:14px; font-weight:700; margin-top:14px; }
  .audio-btn {
    width:64px; height:64px; border-radius:50%; background:var(--sun); box-shadow:var(--shadow-sm);
    display:flex; align-items:center; justify-content:center; font-size:28px; margin: 18px auto 0;
  }
</style>
</head>
<body class="app-student">

  <div class="funder-bar">
    <img class="funder-logo-tud" src="assets/tud_logo_cmyk.png" alt="TU Dortmund Logo">
    <img src="assets/IFS.png" alt="IFS Logo">
    <img src="assets/speak-logo.png" alt="SPEAK Logo">
    <img class="funder-logo-bund" src="assets/Bundesministrerium.jpg" alt="Bundesministerium Logo">
    <img src="assets/EBF.jpg" alt="EBF Logo">
  </div>

  <div class="student-top">
    <a class="back-link" href="11-module-player.html">← Aufgabenpfad</a>
    <div class="h3">Typ A · Bilderbuch-Hörverstehen</div>
    <div class="progress-track" style="width:220px;"><div class="progress-fill" style="width:20%; background:var(--sky);"></div></div>
  </div>

  <div class="stage">
    <div class="book">
      <div class="illustration">🦔🍄</div>
      <div>
        <div class="eyebrow">Bilderbuch · Seite 2 von 5</div>
        <div class="h2" style="margin:8px 0 10px; max-width:340px;">„Der kleine Igel fand einen Pilz im Wald."</div>
        <div class="muted">Der kleine Igel fand einen Pilz im Wald.</div>
        <div class="word-chip">🔊 der Pilz <span style="color:var(--ink-faint); font-weight:400;">— der Pilz</span></div>
        <div class="audio-btn">▶</div>
        <div style="text-align:right; margin-top:26px;">
          <a class="btn btn-lg btn-coral" href="13-task-audio-to-image.html">Weiter ▶</a>
        </div>
      </div>
    </div>
  </div>

</body>
</html>
