<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>SPEAK — Lehrkraft-Login</title>
<link rel="stylesheet" href="theme.css">
<style>
  .center { min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:40px; gap:18px; }
  .field { width:100%; max-width:340px; margin-bottom:14px; text-align:left; }
  .field label { display:block; font-size:13px; font-weight:700; color:var(--ink-soft); margin-bottom:6px; }
  .field input {
    width:100%; height:46px; border-radius:14px; border:2px solid var(--line); padding:0 14px;
    font-size:15px; font-family:var(--font-clean); background:#fff;
  }
</style>
</head>
<body class="app">

  <div class="funder-bar">
    <img class="funder-logo-tud" src="assets/tud_logo_cmyk.png" alt="TU Dortmund Logo">
    <img src="assets/IFS.png" alt="IFS Logo">
    <img src="assets/speak-logo.png" alt="SPEAK Logo">
    <img class="funder-logo-bund" src="assets/Bundesministrerium.jpg" alt="Bundesministerium Logo">
    <img src="assets/EBF.jpg" alt="EBF Logo">
  </div>

  <div class="center">
    <a class="back-link" href="01-home.html" style="align-self:center; margin-bottom:-6px;">← Startseite</a>
    <img class="logo-mark" src="assets/speak-logo.png" alt="SPEAK" style="height:64px;">
    <div class="h2">Bei SPEAK anmelden</div>
    <div class="muted">Zugang für Lehrkräfte — E-Mail und Passwort</div>

    <div style="margin-top:10px; width:100%; max-width:340px;">
      <div class="field">
        <label>E-Mail-Adresse</label>
        <input placeholder="du@schule.de">
      </div>
      <div class="field">
        <label>Passwort</label>
        <input type="password" placeholder="••••••••••">
      </div>
      <div style="display:flex; justify-content:flex-end; margin-bottom:16px;">
        <span class="muted" style="font-size:13px;">Passwort vergessen?</span>
      </div>
      <a class="btn btn-lg btn-coral" href="05-teacher-dashboard.html" style="width:100%;">Anmelden</a>
    </div>

    <div class="muted">Neu hier?
      <a href="02-teacher-register.html" style="color:var(--ink); font-weight:700; text-decoration:none;">Als Lehrkraft registrieren</a>
    </div>

    <a class="pill pill-sun" href="04-student-login.html" style="margin-top:6px;">🧒 Bist du Schüler:in? Nutze stattdessen die Code-Eingabe</a>
  </div>

</body>
</html>
