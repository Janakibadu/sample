services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-speak_root_pw}
      MYSQL_DATABASE: ${DB_NAME:-speak}
      MYSQL_USER: ${DB_USER:-speak_app}
      MYSQL_PASSWORD: ${DB_PASSWORD:-speak_app_pw}
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - speak-mysql-data:/var/lib/mysql
      - ./server/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD:-speak_root_pw}"]
      interval: 5s
      timeout: 5s
      retries: 10

  adminer:
    image: adminer:latest
    restart: unless-stopped
    environment:
      ADMINER_DEFAULT_SERVER: mysql
    ports:
      - "${ADMINER_PORT:-8080}:8080"
    depends_on:
      - mysql

  api:
    build:
      context: ./server
    restart: unless-stopped
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-speak}
      DB_USER: ${DB_USER:-speak_app}
      DB_PASSWORD: ${DB_PASSWORD:-speak_app_pw}
      JWT_SECRET: ${JWT_SECRET:-change-this-to-a-long-random-string}
      PORT: 3000
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
    ports:
      - "${API_PORT:-3000}:3000"
    volumes:
      - ./server:/app
      - /app/node_modules
    depends_on:
      mysql:
        condition: service_healthy

  web:
    build:
      context: ./frontend
    restart: unless-stopped
    environment:
      VITE_API_PROXY_TARGET: http://api:3000
    ports:
      - "${WEB_PORT:-5173}:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - api

volumes:
  speak-mysql-data:
